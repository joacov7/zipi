version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: zipi_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    ports:
      - "4000:4000"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/zipi_db?schema=public
      JWT_SECRET: ${JWT_SECRET:-cambia-esto-en-produccion}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-cambia-esto-refresh-en-produccion}
      PORT: 4000
      CORS_ORIGINS: http://localhost:4001
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "4001:80"
    depends_on:
      - api

volumes:
  postgres_data:
